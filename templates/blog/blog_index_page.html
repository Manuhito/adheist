{% extends "web/base.html" %}
{% load wagtailcore_tags wagtailimages_tags blog_tags static %}

{% block title %}{{ page.title }}{% endblock %}

{% block extra_js %}
{{ block.super }}
{% with blog_posts=page.get_ordered_blog_posts %}
<script>
  window.__BLOG_DATA__ = {{ blog_posts|serialize_blog_posts|safe }};
</script>
{% endwith %}
<script src="{% static 'js/blog-bundle.js' %}"></script>
{% endblock %}

{% block content %}
<!-- Dejamos el bloque de contenido vacío para que el componente React se monte en page-content-mount -->
{% endblock %}
