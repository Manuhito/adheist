{% extends "web/app/app_base.html" %}
{% load static %}

{% block extra_js %}
{{ block.super }}
<script src="{% static 'js/create-adrequest-bundle.js' %}" defer></script>
{% endblock %}

{% block app %}
<div class="container mx-auto px-4 py-8">  
  <!-- React app mount point with data attributes -->
  <div 
    id="create-adrequest-app" 
    data-adrequest-id="{{ adrequest_id }}" 
    data-status="{{ adrequest_data.status|default:'NEW' }}"
  ></div>
  
  <!-- Pass AdRequest data as JSON -->
  {% if adrequest_data %}
    {{ adrequest_data|json_script:"adrequest-data" }}
  {% endif %}
  
  <!-- Pass user permissions to JavaScript -->
  <script>
    window.__USER_PERMISSIONS__ = {
      isStaff: {% if request.user.is_staff %}true{% else %}false{% endif %}
    };
  </script>
</div>
{% endblock %}
