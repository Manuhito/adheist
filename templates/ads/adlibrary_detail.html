{% extends "web/app/app_base.html" %}
{% load static %}
{% load i18n %}

{% block app %}
<div id="page-content">
  <div class="app-card">
    <!-- Script con los datos JSON para React -->
    <script id="adrequest-data" type="application/json">
    {{ adrequest_json|safe }}
    </script>
    
    <!-- Contenedor para el componente React -->
    <div id="revision-adrequest-container" class="w-full"></div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
{{ block.super }}
<script>
  // Asegurarnos de que el script se carga correctamente
  document.addEventListener('DOMContentLoaded', function() {
    console.log('DOM fully loaded for revision-adrequest');
    // Cargar el script de React dinámicamente
    var script = document.createElement('script');
    script.src = "{% static 'js/revision-adrequest-bundle.js' %}";
    script.onload = function() {
      console.log('Revision AdRequest script loaded successfully');
    };
    script.onerror = function() {
      console.error('Error loading Revision AdRequest script');
    };
    document.body.appendChild(script);
  });
</script>
{% endblock %}
