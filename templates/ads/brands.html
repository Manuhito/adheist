{% extends "web/app/app_base_sidebar.html" %}
{% load static %}

{% block extra_js %}
{{ block.super }}
<script>
  // Configure sidebar for this page
  window.__SIDEBAR_DATA__ = {
    activeTab: "brands-library",
    showHeader: true,
    hideLogo: true
  };
</script>
<script>
  // Pass data to React component
  window.__BRANDS_DATA__ = {
    user: {
      name: "{{ request.user.get_full_name|default:'' }}",
      email: "{{ request.user.email|default:'' }}"
    },
    brands: {{ brands_data|safe }}
  };
</script>
<script src="{% static 'js/brands-page-bundle.js' %}?v={{ STATIC_VERSION }}"></script>
{% endblock %}

{% block app %}
<!-- Content will be mounted by React in sidebar-page-content -->
{% endblock %}
