{% extends "web/app/app_base.html" %}
{% load static %}

{% block content %}
<div class="max-w-4xl mx-auto py-12 px-4">
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-green-100 mb-4">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
      </svg>
    </div>
    <h1 class="text-3xl font-bold">Payment Successful!</h1>
    <p class="text-gray-600 mt-2">Thank you for your subscription.</p>
  </div>
  
  <div class="bg-white rounded-lg shadow-md p-6 mb-8">
    <h2 class="text-xl font-semibold mb-4">Subscription Details</h2>
    <div id="subscription-details">
      <!-- Will be populated if payment data is available -->
      <p class="text-gray-600">Your subscription has been activated. You now have access to all the features of your plan.</p>
    </div>
  </div>
  
  <div class="flex justify-center">
    <a href="/ads/billing/" class="bg-primary text-white py-2 px-6 rounded-md hover:bg-primary/90 transition-colors">
      Return to Billing
    </a>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Clear payment data from sessionStorage
    sessionStorage.removeItem('stripePaymentData');
    
    // Could fetch subscription details from backend here if needed
  });
</script>
{% endblock %}
