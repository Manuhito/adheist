<!-- PostHog User Identification and Tracking -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (typeof posthog !== 'undefined') {
      {% if user.is_authenticated %}
      // Identify user by email
      (function () {
        const distinctId = '{{ user.id }}';
        const email = '{{ user.email }}';

        try {
          if (typeof posthog.get_distinct_id === 'function') {
            const currentId = posthog.get_distinct_id();
            const aliasKey = `ph_alias_${distinctId}`;
            const hasAliased = window.localStorage && window.localStorage.getItem(aliasKey) === '1';

            if (!hasAliased && typeof posthog.alias === 'function' && currentId === email && currentId !== distinctId) {
              posthog.alias(distinctId, currentId);
              if (window.localStorage) window.localStorage.setItem(aliasKey, '1');
            }
          }
        } catch (e) { }

        posthog.identify(distinctId, {
          name: '{{ user.get_full_name|default:user.username }}',
          email: '{{ user.email }}',
          id: '{{ user.id }}',
          last_login: '{{ user.last_login|date:"c" }}'
        });
      })();

      // Set user properties
      posthog.people.set({
        $name: '{{ user.get_full_name|default:user.username }}',
        $email: '{{ user.email }}',
        user_id: '{{ user.id }}',
        date_joined: '{{ user.date_joined|date:"c" }}'
      });
      {% endif %}

      // Automatic page view tracking from middleware
      {% if posthog_tracking and posthog_tracking.event == 'page_view' %}
      posthog.capture(
        'Page View',
        {{ posthog_tracking.properties | safe }}
      );
  {% endif %}
    }
  });
</script>
<!-- End PostHog User Identification and Tracking -->
