{% extends "web/base_core.html" %}
{% load static %}
{% block top_nav %}
{% endblock %}
{% block messages %}
{% include 'web/components/messages.html' %}
{% endblock messages %}
{% block body %}
{# Loading State #}
<div id="loading-state"
  class="fixed inset-0 bg-base-100 z-[9999] flex items-center justify-center transition-opacity duration-300 ease-in-out">
  <div class="animate-spin rounded-full h-16 w-16 border-4 border-primary border-t-transparent"></div>
</div>

<div id="root"></div>
<script src="{% static 'js/base-bundle.js' %}"></script>
<div id="page-content">
  {% block content %}{% endblock %}
</div>

{# React Base Layout #}
<script>
  // Show loading state immediately
  document.getElementById('loading-state').style.display = 'flex';

  // Function to handle initialization
  function handleInitialization() {
    const loadingState = document.getElementById('loading-state');
    const root = document.getElementById('root');

    if (loadingState && root) {
      // Show content
      root.style.opacity = '1';

      // Hide loading state
      loadingState.style.opacity = '0';
      setTimeout(() => {
        loadingState.style.display = 'none';
      }, 300);
    }
  }

  // Try both DOMContentLoaded and load events
  document.addEventListener('DOMContentLoaded', handleInitialization);
  window.addEventListener('load', handleInitialization);
</script>

<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>
<script>
  lucide.createIcons();
</script>

{% endblock %}
