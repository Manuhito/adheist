[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid
user=root

# Run Django migrations first
[program:migrate]
command=python /code/manage.py migrate --noinput
directory=/code
autostart=true
autorestart=false
startsecs=0
startretries=1
redirect_stderr=true
stdout_logfile=/var/log/migrate.log
priority=100

# Start Gunicorn next
[program:gunicorn]
command=gunicorn adheist.wsgi:application --bind 127.0.0.1:8000 --workers 4 --threads 2 --worker-class=gthread --worker-connections=1000 --timeout 120 --keep-alive 5 --max-requests 1000 --max-requests-jitter 50 --log-level info
directory=/code
autostart=true
autorestart=true
startsecs=5
startretries=3
redirect_stderr=true
stdout_logfile=/var/log/gunicorn/access.log
stderr_logfile=/var/log/gunicorn/error.log
priority=800

# Ensure log directories exist
[program:create_log_dirs]
command=mkdir -p /var/log/gunicorn /var/log/nginx /var/log/django
directory=/code
autostart=true
autorestart=false
startsecs=0
startretries=1
redirect_stderr=true
priority=50

# Start Nginx last
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=5
startretries=3
redirect_stderr=true
stdout_logfile=/var/log/nginx/access.log
stderr_logfile=/var/log/nginx/error.log
priority=900
